# References

workdir:
    WORKDIR
manifest:
    WORKDIR/config/samples.tsv
tools:
    PIPELINE_HOME/resources/tools.yaml
cluster:
    WORKDIR/config/cluster.yaml

# Folder containing Sample_<library>_<mode>_<FCID> FASTQ folders
rawdir:
    /data/khanlab/projects/DATA
# Cell Ranger GEX reference (standard or custom)
gex_ref:
    /path/to/custom/reference/
# Cell Ranger VDJ reference
vdj_ref:
    /fdb/cellranger/refdata-cellranger-vdj-GRCh38-alts-ensembl-7.1.0/
# Cell Ranger feature reference (antibody/hashtag barcodes)
feature_ref:
    /path/to/feature_ref.csv

# Set to false for CITEseq-only runs (5GEX/BC, no TCR)
has_tcr: true

# Force cells
force: false
force_cells: 20000

# QC thresholds
nFeature_RNA_min: 500
nFeature_RNA_max: 6000
percent_mt_max: 10
